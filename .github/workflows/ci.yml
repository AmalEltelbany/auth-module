name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # After npm ci, which deletes node_modules. mongodb-memory-server downloads
      # a ~100 MB mongod binary on first use; the e2e tests pin it to this path.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongod-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
