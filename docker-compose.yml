services:
  # Single-node replica set: transactions (used by password reset) need one.
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # Loopback only: the unauthenticated dev database is never reachable from the network.
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the replica set on first start, then just reports its status.
      test: >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10

  # Catches every email the API sends. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

volumes:
  mongo-data:
